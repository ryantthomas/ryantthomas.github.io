<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 462" width="900" height="462" role="img"
     aria-label="Architecture: GitHub Actions deploys via Workload Identity Federation to Artifact Registry and Terraform. Three dlt pipelines run as Cloud Run Jobs into BigQuery raw. A GraphRAG extraction job writes into BigQuery knowledge. A Cloud Run MCP service and query API serve it to Claude. Cloud Scheduler triggers daily; Secret Manager holds credentials.">
<style>
  .bg   { fill: #fdfdfc; }
  .box  { fill: #ffffff; stroke: #d8d5cd; stroke-width: 1.5; rx: 7; }
  .zone { fill: #f5f4f1; stroke: #e2e0da; stroke-width: 1.5; rx: 10; }
  .acc  { fill: #eaf1ee; stroke: #2f5d50; stroke-width: 1.5; rx: 7; }
  .t    { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #23211d; }
  .tb   { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 650; fill: #23211d; }
  .ts   { font-family: ui-monospace, Consolas, monospace; font-size: 10.5px; fill: #6b6862; }
  .zl   { font-family: ui-monospace, Consolas, monospace; font-size: 11px; fill: #6b6862; letter-spacing: .06em; }
  .ln   { stroke: #a9a49a; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  .lnd  { stroke: #a9a49a; stroke-width: 1.4; fill: none; stroke-dasharray: 4 4; marker-end: url(#a); }
  .ah   { fill: #a9a49a; }
  @media (prefers-color-scheme: dark) {
    .bg   { fill: #16161a; }
    .box  { fill: #1e1e23; stroke: #3a3a44; }
    .zone { fill: #1b1b20; stroke: #32323a; }
    .acc  { fill: #1c2c27; stroke: #7fbfa8; }
    .t, .tb { fill: #e8e6e1; }
    .ts, .zl { fill: #a3a099; }
    .ln, .lnd { stroke: #6d6a63; }
    .ah   { fill: #6d6a63; }
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" class="ah"/>
  </marker>
</defs>

<rect class="bg" x="0" y="0" width="900" height="462"/>

<!-- source of truth -->
<rect class="acc" x="20" y="20" width="180" height="58"/>
<text class="tb" x="34" y="43">GitHub Actions</text>
<text class="ts" x="34" y="62">push to main · WIF</text>

<!-- GCP zone -->
<rect class="zone" x="20" y="104" width="860" height="338"/>
<text class="zl" x="36" y="128">GOOGLE CLOUD</text>

<!-- artifact registry -->
<rect class="box" x="40" y="146" width="180" height="52"/>
<text class="tb" x="54" y="168">Artifact Registry</text>
<text class="ts" x="54" y="186">ingestion · graphrag · mcp</text>

<!-- scheduler -->
<rect class="box" x="40" y="222" width="180" height="52"/>
<text class="tb" x="54" y="244">Cloud Scheduler</text>
<text class="ts" x="54" y="262">daily triggers</text>

<!-- secret manager -->
<rect class="box" x="40" y="298" width="180" height="68"/>
<text class="tb" x="54" y="320">Secret Manager</text>
<text class="ts" x="54" y="338">discord · gmail · calendar</text>
<text class="ts" x="54" y="352">claude-api-key</text>

<!-- IAM -->
<rect class="box" x="40" y="390" width="180" height="52"/>
<text class="tb" x="54" y="412">IAM</text>
<text class="ts" x="54" y="430">per-workload SAs + WIF</text>

<!-- ingestion jobs -->
<rect class="box" x="266" y="150" width="196" height="112"/>
<text class="tb" x="280" y="172">Cloud Run Jobs — dlt</text>
<text class="ts" x="280" y="196">ingest-discord</text>
<text class="ts" x="280" y="214">ingest-gmail</text>
<text class="ts" x="280" y="232">ingest-google-calendar</text>
<text class="ts" x="280" y="252">scale to zero</text>

<!-- extraction job -->
<rect class="box" x="266" y="300" width="196" height="86"/>
<text class="tb" x="280" y="322">Cloud Run Job</text>
<text class="ts" x="280" y="342">graphrag-extraction</text>
<text class="ts" x="280" y="360">raw → Claude → knowledge</text>
<text class="ts" x="280" y="376">chunk ledger = idempotent</text>

<!-- bigquery -->
<rect class="acc" x="516" y="150" width="180" height="112"/>
<text class="tb" x="530" y="172">BigQuery · raw</text>
<text class="ts" x="530" y="196">discord_messages</text>
<text class="ts" x="530" y="214">gmail_messages</text>
<text class="ts" x="530" y="232">calendar_events</text>

<rect class="acc" x="516" y="300" width="180" height="86"/>
<text class="tb" x="530" y="322">BigQuery · knowledge</text>
<text class="ts" x="530" y="342">entities</text>
<text class="ts" x="530" y="360">relationships</text>
<text class="ts" x="530" y="376">processed_chunks</text>

<!-- serving -->
<rect class="box" x="740" y="150" width="120" height="86"/>
<text class="tb" x="754" y="172">Cloud Run</text>
<text class="tb" x="754" y="190">Service</text>
<text class="ts" x="754" y="210">mcp</text>
<text class="ts" x="754" y="226">OAuth 2.1</text>

<rect class="box" x="740" y="300" width="120" height="86"/>
<text class="tb" x="754" y="322">Cloud Run</text>
<text class="tb" x="754" y="340">Service</text>
<text class="ts" x="754" y="360">graphrag-api</text>
<text class="ts" x="754" y="376">NL → subgraph</text>

<!-- edges -->
<path class="ln" d="M 110 78 L 110 142"/>
<path class="ln" d="M 220 172 L 262 172"/>
<path class="lnd" d="M 220 248 L 244 248 L 244 206 L 262 206"/>
<path class="lnd" d="M 220 332 L 262 332"/>
<path class="ln" d="M 462 206 L 512 206"/>
<path class="ln" d="M 606 262 L 606 296"/>
<path class="ln" d="M 462 342 L 512 342"/>
<path class="ln" d="M 696 206 L 736 196"/>
<path class="ln" d="M 696 342 L 736 342"/>
<path class="lnd" d="M 700 330 L 716 330 L 716 236 L 736 226"/>

<text class="ts" x="470" y="200">load</text>
<text class="ts" x="612" y="284">extract</text>
<text class="ts" x="470" y="336">write</text>
</svg>
