<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ryan Thomas | Resume</title>
  <meta name="description" content="Resume for Ryan Thomas, Data and Analytics Engineer." />
  <link rel="canonical" href="https://ryantthomas.github.io/resume/" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap">
    <nav>
      <a class="brand" href="/">Ryan Thomas</a>
      <a href="/">Home</a>
      <a href="/resume/" class="active">Resume</a>
      <a href="https://github.com/ryantthomas">GitHub</a>
      <a href="https://www.linkedin.com/in/ryan-t-thomas/">LinkedIn</a>
      <a href="mailto:ryanthomas624@gmail.com">Email</a>
    </nav>

    <header>
      <h1>Resume</h1>
      <p class="resume-note muted">
        Pulled live from my
        <a href="https://github.com/ryantthomas/resume">resume repository</a>
        on GitHub, which is the single source of truth. It's what updates
        when I update that repo.
      </p>
    </header>

    <main>
      <p class="resume-actions">
        <button id="download-pdf" class="btn" type="button" disabled>Download as PDF</button>
        <a id="open-tab" href="https://github.com/ryantthomas/resume" target="_blank" rel="noopener">Open in a new tab ↗</a>
        <a href="https://github.com/ryantthomas/resume">View source on GitHub ↗</a>
      </p>

      <div class="resume-frame-wrap">
        <iframe
          id="resume-frame"
          class="resume-frame"
          title="Ryan Thomas resume"
        ></iframe>
        <p id="resume-fallback" class="resume-fallback muted" hidden>
          Couldn't load the resume inline. View it directly on
          <a href="https://github.com/ryantthomas/resume">GitHub</a>.
        </p>
      </div>
    </main>
  </div>

  <script>
    (function () {
      var RAW_URL = 'https://raw.githubusercontent.com/ryantthomas/resume/main/index.html';
      var frame = document.getElementById('resume-frame');
      var fallback = document.getElementById('resume-fallback');
      var downloadBtn = document.getElementById('download-pdf');
      var openTab = document.getElementById('open-tab');

      fetch(RAW_URL)
        .then(function (res) {
          if (!res.ok) throw new Error('fetch failed: ' + res.status);
          return res.text();
        })
        .then(function (html) {
          // srcdoc makes the frame same-origin, so print() and PDF export can
          // reach into it. A plain src="raw.githubusercontent.com/..." would
          // render as escaped source text, since GitHub serves raw files as
          // text/plain with nosniff.
          frame.srcdoc = html;

          var blobUrl = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
          openTab.href = blobUrl;

          downloadBtn.disabled = false;
          downloadBtn.addEventListener('click', function () {
            frame.contentWindow.focus();
            frame.contentWindow.print();
          });
        })
        .catch(function () {
          frame.hidden = true;
          fallback.hidden = false;
        });
    })();
  </script>
</body>
</html>
